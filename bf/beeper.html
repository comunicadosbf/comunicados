<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Beeper BMM - Escalación</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-950: #06111F;
    --navy-900: #0B1B2E;
    --navy-800: #122841;
    --navy-700: #1B3A5C;
    --blue-500: #0072CE;
    --blue-400: #2E92E8;
    --blue-100: #E4F0FC;
    --amber: #F5A623;
    --amber-dim: rgba(245, 166, 35, 0.14);
    --red: #FF5A5F;
    --red-dim: rgba(255, 90, 95, 0.14);
    --text: #EAF1FA;
    --text-muted: #8FA3BC;
    --border: rgba(255,255,255,0.08);
    --radius-lg: 22px;
    --radius-md: 14px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: 17px; }

  body {
    font-family: var(--font-body);
    background: var(--navy-950);
    background-image: radial-gradient(circle at 20% 0%, rgba(0,114,206,0.10) 0%, transparent 45%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 40px;
  }

  /* ---------- LOGIN ---------- */
  .login-card {
    background: var(--navy-900);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 34px 26px;
    width: 100%;
    max-width: 380px;
  }
  .login-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--blue-500), #003D75);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  .login-card h1 {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .login-card p {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 22px;
  }
  .login-card label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .login-card input {
    width: 100%;
    padding: 15px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--navy-950);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 19px;
    letter-spacing: 0.08em;
    text-align: center;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .login-card input:focus {
    outline: none;
    border-color: var(--blue-500);
    box-shadow: 0 0 0 4px rgba(0, 114, 206, 0.18);
  }
  .login-card button {
    width: 100%;
    padding: 15px;
    margin-top: 16px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--blue-500), #003D75);
    color: white;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 114, 206, 0.28);
  }
  .login-card button:disabled { opacity: 0.55; cursor: not-allowed; }
  .login-error {
    margin-top: 14px;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    background: var(--red-dim);
    color: #FF9A9E;
    font-size: 13px;
    text-align: center;
    display: none;
  }

  /* ---------- BEEPER (pantalla principal) ---------- */
  .beeper-body { display: none; width: 100%; max-width: 420px; }

  /* Barra superior de usuario */
  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--navy-900);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .user-info-block { display: flex; align-items: center; gap: 13px; }
  .user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--navy-700);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    color: var(--blue-400);
  }
  .user-name { font-size: 17px; font-weight: 600; color: var(--text); }
  .user-rango { font-size: 13.5px; color: var(--text-muted); margin-top: 1px; }
  .badge-count {
    background: var(--red);
    color: white;
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font-mono);
  }
  .badge-count.cero { background: var(--navy-700); color: var(--text-muted); }

  /* Tarjeta de alerta */
  .alert-shell {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-btn {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--navy-900);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--navy-800); color: var(--text); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn svg { width: 20px; height: 20px; }

  .alert-card {
    flex: 1;
    background: var(--navy-900);
    border: 1px solid var(--border);
    border-left: 5px solid var(--blue-500);
    border-radius: var(--radius-lg);
    padding: 28px 22px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: border-color 0.2s;
  }
  .alert-card.nivel-om { border-left-color: var(--amber); }
  .alert-card.nivel-pcd { border-left-color: var(--red); }

  .lcd-empty {
    text-align: center;
    font-size: 16px;
    color: var(--text-muted);
  }

  .lcd-nivel {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 6px 13px 6px 11px;
    border-radius: 100px;
    background: var(--blue-100);
    color: var(--blue-500);
    width: fit-content;
    margin-bottom: 18px;
    font-family: var(--font-body);
  }
  .alert-card.nivel-om .lcd-nivel { background: var(--amber-dim); color: var(--amber); }
  .alert-card.nivel-pcd .lcd-nivel { background: var(--red-dim); color: var(--red); }

  .lcd-fit {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .lcd-emisor {
    font-size: 14.5px;
    color: var(--text-muted);
    margin-bottom: 18px;
  }
  .lcd-mensaje {
    font-size: 18px;
    line-height: 1.55;
    color: var(--text);
  }

  /* Indicador de alarma */
  .alarm-indicator {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 14px;
    padding: 9px;
    border-radius: var(--radius-md);
    background: var(--red-dim);
    color: #FF9A9E;
    font-size: 12.5px;
    font-weight: 600;
  }
  .alarm-indicator.activa { display: flex; animation: parpadeo 1.1s infinite; }
  @media (prefers-reduced-motion: reduce) { .alarm-indicator.activa { animation: none; } }
  @keyframes parpadeo { 50% { opacity: 0.45; } }
  .alarm-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--red);
  }

  /* Botones de acción */
  .beeper-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .beeper-controls.solo-visto { grid-template-columns: 1fr; }

  .btn-ctrl {
    padding: 17px 0;
    border: 1.5px solid transparent;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.08s, box-shadow 0.15s;
  }
  .btn-ctrl:active { transform: scale(0.98); }
  .btn-visto {
    background: linear-gradient(135deg, var(--blue-500), #003D75);
    color: white;
    box-shadow: 0 8px 18px rgba(0, 114, 206, 0.30);
  }
  .btn-atendido {
    background: linear-gradient(135deg, #1FA971, #0E7A50);
    color: white;
    box-shadow: 0 8px 18px rgba(31, 169, 113, 0.25);
  }
  .btn-ctrl:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .btn-ctrl.oculto { display: none; }
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div class="login-card" id="loginCard">
  <div class="login-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </div>
  <h1>Beeper BMM</h1>
  <p>Ingresa tu número de nómina para recibir alertas</p>
  <label for="inputNomina">Número de nómina</label>
  <input type="text" id="inputNomina" inputmode="numeric" placeholder="00000" maxlength="10">
  <button id="btnLogin">Ingresar</button>
  <div class="login-error" id="loginError"></div>
</div>

<!-- PANTALLA DEL BEEPER -->
<div class="beeper-body" id="beeperBody">
  <div class="user-bar">
    <div class="user-info-block">
      <div class="user-avatar" id="userAvatar">--</div>
      <div>
        <div class="user-name" id="nombreUsuario">-</div>
        <div class="user-rango" id="infoRango">-</div>
      </div>
    </div>
    <span class="badge-count" id="contadorAlertas">0</span>
  </div>

  <div class="alert-shell">
    <button class="nav-btn" id="btnPrev" aria-label="Alerta anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="alert-card" id="lcdScreen">
      <div class="lcd-empty">Sin alertas pendientes</div>
    </div>

    <button class="nav-btn" id="btnNext" aria-label="Siguiente alerta">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="alarm-indicator" id="alarmaIndicador">
    <span class="alarm-dot"></span>
    Alerta sin ver
  </div>

  <div class="beeper-controls">
    <button class="btn-ctrl btn-visto" id="btnVisto">Visto</button>
    <button class="btn-ctrl btn-atendido" id="btnAtendido">Atendido</button>
  </div>
</div>

<script type="module">
  import { db, auth, messaging, iniciarSesionAnonima, VAPID_KEY, APPS_SCRIPT_URL } from "./firebase-config.js";
  import { doc, setDoc, collection, query, where, onSnapshot, updateDoc, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js";

  // ============ GENERADOR DE ALARMA (Web Audio API, sin archivo externo) ============
  let audioCtx = null;
  let alarmaActiva = false;
  let alarmaTimeoutId = null;

  function iniciarAlarma() {
    if (alarmaActiva) return;
    alarmaActiva = true;

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    reproducirBeepRepetido();
  }

  function reproducirBeepRepetido() {
    if (!alarmaActiva) return;
    tocarTono(880, 0.15);
    setTimeout(() => tocarTono(880, 0.15), 250);
    alarmaTimeoutId = setTimeout(reproducirBeepRepetido, 900);
  }

  function tocarTono(frecuencia, duracion) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.value = frecuencia;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracion);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duracion);
  }

  function detenerAlarma() {
    alarmaActiva = false;
    if (alarmaTimeoutId) {
      clearTimeout(alarmaTimeoutId);
      alarmaTimeoutId = null;
    }
  }

  iniciarSesionAnonima().catch(err => console.error("Error auth anónima:", err));

  let empleadoActual = null;
  let alertasPendientes = [];
  let indiceActual = 0;
  let unsubscribe = null;

  const loginCard = document.getElementById("loginCard");
  const beeperBody = document.getElementById("beeperBody");
  const inputNomina = document.getElementById("inputNomina");
  const btnLogin = document.getElementById("btnLogin");
  const loginError = document.getElementById("loginError");

  // ---------- LOGIN ----------
  btnLogin.addEventListener("click", hacerLogin);
  inputNomina.addEventListener("keypress", (e) => { if (e.key === "Enter") hacerLogin(); });

  async function hacerLogin() {
    const nomina = inputNomina.value.trim();
    if (!nomina) return;

    btnLogin.disabled = true;
    btnLogin.textContent = "Verificando...";
    loginError.style.display = "none";

    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=login&nomina=${encodeURIComponent(nomina)}`);
      const data = await res.json();

      if (!data.valido) {
        throw new Error(data.mensaje || "Nómina no encontrada");
      }

      empleadoActual = data.empleado;
      await registrarTokenFCM();
      mostrarBeeper();
      escucharAlertas();

    } catch (err) {
      loginError.textContent = "❌ " + err.message;
      loginError.style.display = "block";
    } finally {
      btnLogin.disabled = false;
      btnLogin.textContent = "Ingresar";
    }
  }

  // ---------- REGISTRAR TOKEN FCM ----------
  async function registrarTokenFCM() {
    try {
      const permiso = await Notification.requestPermission();
      if (permiso !== "granted") {
        console.warn("Permiso de notificaciones no otorgado");
        return;
      }
      const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });

      if (token) {
        await setDoc(doc(db, "tokens", empleadoActual.nomina), {
          nomina: empleadoActual.nomina,
          nombre: empleadoActual.nombre,
          rango: empleadoActual.rango,
          fcmToken: token,
          actualizado: serverTimestamp()
        });
      }
    } catch (err) {
      console.error("Error registrando token FCM:", err);
    }
  }

  // ---------- MOSTRAR BEEPER ----------
  function mostrarBeeper() {
    loginCard.style.display = "none";
    beeperBody.style.display = "block";
    document.getElementById("nombreUsuario").textContent = empleadoActual.nombre;
    document.getElementById("infoRango").textContent = empleadoActual.rango;

    const iniciales = empleadoActual.nombre
      .split(" ")
      .filter(Boolean)
      .slice(0, 2)
      .map(p => p[0].toUpperCase())
      .join("");
    document.getElementById("userAvatar").textContent = iniciales || "--";
  }

  // ---------- ESCUCHAR ALERTAS EN TIEMPO REAL ----------
  function escucharAlertas() {
    const q = query(
      collection(db, "alertas"),
      where("destinatarioActual.nomina", "==", empleadoActual.nomina),
      where("estado", "==", "pendiente")
    );

    unsubscribe = onSnapshot(q, (snapshot) => {
      alertasPendientes = [];
      snapshot.forEach((docSnap) => {
        alertasPendientes.push({ id: docSnap.id, ...docSnap.data() });
      });

      alertasPendientes.sort((a, b) => (b.horaCreacion?.seconds || 0) - (a.horaCreacion?.seconds || 0));

      if (indiceActual >= alertasPendientes.length) indiceActual = 0;

      renderizarPantalla();
      actualizarAlarma();
    });
  }

  // ---------- RENDERIZAR TARJETA DE ALERTA ----------
  function renderizarPantalla() {
    const lcd = document.getElementById("lcdScreen");
    const contador = document.getElementById("contadorAlertas");
    const noVistas = alertasPendientes.filter(a => a.visto === false).length;
    contador.textContent = noVistas;
    contador.classList.toggle("cero", noVistas === 0);

    // Clase de color según nivel — SOLO presentación, no altera datos ni flujo
    lcd.classList.remove("nivel-tl", "nivel-om", "nivel-pcd");

    if (alertasPendientes.length === 0) {
      lcd.innerHTML = '<div class="lcd-empty">Sin alertas pendientes</div>';
      document.getElementById("btnVisto").disabled = true;
      document.getElementById("btnAtendido").disabled = true;
      return;
    }

    const alerta = alertasPendientes[indiceActual];
    const nivelTexto = { TeamLeader: "Team Leader", OperationsManager: "Operations Mgr", PCDirector: "PC Director" };
    const nivelClase = { TeamLeader: "nivel-tl", OperationsManager: "nivel-om", PCDirector: "nivel-pcd" };
    lcd.classList.add(nivelClase[alerta.nivelActual] || "nivel-tl");

    const estadoVisto = alerta.visto ? "👁 Visto" : "🔴 Sin ver";

    lcd.innerHTML = `
      <div class="lcd-nivel">${nivelTexto[alerta.nivelActual] || alerta.nivelActual} · ${indiceActual + 1}/${alertasPendientes.length} · ${estadoVisto}</div>
      <div class="lcd-fit">📍 FIT ${alerta.fit}</div>
      <div class="lcd-emisor">De: ${alerta.emisor}</div>
      <div class="lcd-mensaje">${alerta.mensaje}</div>
    `;

    const btnVisto = document.getElementById("btnVisto");
    const btnAtendido = document.getElementById("btnAtendido");
    const controles = document.querySelector(".beeper-controls");

    btnVisto.disabled = alerta.visto;

    // Alertas tipo "informar": solo se ve el botón Visto, sin Atendido
    if (alerta.tipoAlerta === "informar") {
      btnAtendido.classList.add("oculto");
      controles.classList.add("solo-visto");
    } else {
      btnAtendido.classList.remove("oculto");
      controles.classList.remove("solo-visto");
      btnAtendido.disabled = false;
    }
  }

  // ---------- ALARMA ----------
  function actualizarAlarma() {
    const hayNoVistas = alertasPendientes.some(a => a.visto === false);
    const indicador = document.getElementById("alarmaIndicador");

    if (hayNoVistas) {
      indicador.classList.add("activa");
      iniciarAlarma();
    } else {
      indicador.classList.remove("activa");
      detenerAlarma();
    }
  }

  // ---------- NAVEGACIÓN ----------
  document.getElementById("btnPrev").addEventListener("click", () => {
    if (alertasPendientes.length === 0) return;
    indiceActual = (indiceActual - 1 + alertasPendientes.length) % alertasPendientes.length;
    renderizarPantalla();
  });

  document.getElementById("btnNext").addEventListener("click", () => {
    if (alertasPendientes.length === 0) return;
    indiceActual = (indiceActual + 1) % alertasPendientes.length;
    renderizarPantalla();
  });

  // ---------- BOTÓN VISTO ----------
  document.getElementById("btnVisto").addEventListener("click", async () => {
    if (alertasPendientes.length === 0) return;
    const alerta = alertasPendientes[indiceActual];
    try {
      if (alerta.tipoAlerta === "informar") {
        // Las alertas "Informar" se cierran solas al ver: no requieren Atendido
        // y así el trigger de escalación ya no las toma en cuenta (deja de estar "pendiente").
        await updateDoc(doc(db, "alertas", alerta.id), {
          visto: true,
          estado: "atendido",
          historial: arrayUnion({
            nivel: alerta.nivelActual,
            accion: "atendido_automatico_informar",
            nombreDestinatario: empleadoActual.nombre
          })
        });
      } else {
        await updateDoc(doc(db, "alertas", alerta.id), { visto: true });
      }
      alerta.visto = true;
      renderizarPantalla();
      actualizarAlarma();
    } catch (err) {
      console.error("Error marcando visto:", err);
    }
  });

  // ---------- BOTÓN ATENDIDO ----------
  document.getElementById("btnAtendido").addEventListener("click", async () => {
    if (alertasPendientes.length === 0) return;
    const alerta = alertasPendientes[indiceActual];
    if (!confirm("¿Confirmas que esta alerta fue atendida?")) return;

    try {
      await updateDoc(doc(db, "alertas", alerta.id), {
        estado: "atendido",
        historial: arrayUnion({
          nivel: alerta.nivelActual,
          accion: "atendido",
          nombreDestinatario: empleadoActual.nombre
        })
      });
      indiceActual = 0;
    } catch (err) {
      console.error("Error marcando atendido:", err);
    }
  });

  // ---------- PUSH EN PRIMER PLANO (app abierta) ----------
  onMessage(messaging, (payload) => {
    console.log("Push recibido en primer plano:", payload);
    iniciarAlarma();
  });
</script>

</body>
</html>
