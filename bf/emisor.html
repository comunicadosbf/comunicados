<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nueva Alerta - Beeper BMM</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #00284D;
    --blue-700: #00549F;
    --blue-500: #0072CE;
    --blue-100: #E4F0FC;
    --surface: #F4F7FB;
    --card: #FFFFFF;
    --text: #101828;
    --text-muted: #5B6472;
    --border: #E2E8F0;
    --radius-lg: 20px;
    --radius-md: 14px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding-bottom: 40px;
  }

  .app {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    min-height: 100vh;
    box-shadow: 0 0 60px rgba(0, 40, 77, 0.08);
  }

  /* ---------- HEADER ---------- */
  .header {
    background: linear-gradient(135deg, var(--navy-900) 0%, var(--blue-700) 65%, var(--blue-500) 100%);
    padding: 32px 28px 44px;
    border-radius: 0 0 32px 32px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: "";
    position: absolute;
    top: -60px;
    right: -60px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 5px 12px 5px 10px;
    border-radius: 100px;
    font-size: 11.5px;
    color: #E4F0FC;
    letter-spacing: 0.03em;
    margin-bottom: 18px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ADE80;
    box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
    animation: pulse 2s infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .status-dot { animation: none; }
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55); }
    70% { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
  }
  .eyebrow {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .title {
    font-family: var(--font-display);
    font-size: 27px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  /* ---------- FORM ---------- */
  .form-area {
    padding: 26px 24px 32px;
  }

  .field {
    margin-bottom: 20px;
  }
  .field-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .field-label svg { flex-shrink: 0; color: var(--blue-500); }
  .field-label .required { color: var(--blue-500); font-weight: 700; }

  .input-wrap {
    position: relative;
  }
  input[type="text"], textarea, select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 13px 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: #9AA4B2; }

  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--blue-500);
    box-shadow: 0 0 0 4px var(--blue-100);
  }

  textarea { resize: vertical; min-height: 92px; line-height: 1.5; }

  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 40px;
    cursor: pointer;
  }
  .select-chevron {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    color: var(--text-muted);
  }

  /* ---------- BOTONES DE ACCIÓN ---------- */
  .actions {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    padding: 15px 18px;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.15s, opacity 0.15s;
    border: 1.5px solid transparent;
  }
  .btn:active { transform: scale(0.985); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  .btn-informar {
    background: var(--blue-100);
    border-color: #C7E0F9;
    color: var(--blue-700);
  }
  .btn-informar:hover:not(:disabled) { background: #D9EAFB; }

  .btn-escalar {
    background: linear-gradient(135deg, var(--blue-700), var(--navy-900));
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(0, 84, 159, 0.28);
  }
  .btn-escalar:hover:not(:disabled) { box-shadow: 0 10px 24px rgba(0, 84, 159, 0.36); }

  .action-hint {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-top: -2px;
    line-height: 1.4;
  }

  /* ---------- MENSAJE DE RESULTADO ---------- */
  .resultado {
    margin-top: 18px;
    padding: 13px 16px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    text-align: center;
    display: none;
    font-weight: 500;
  }
  .resultado.ok { background: #E7F7EE; color: #1A7A44; display: block; }
  .resultado.error { background: #FDECEC; color: #C0292F; display: block; }

  /* ---------- FOOTER ---------- */
  .footer {
    display: flex;
    justify-content: center;
    padding: 28px 0 8px;
  }
  .footer img {
    height: 46px;
    opacity: 0.9;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="status-pill">
      <span class="status-dot"></span>
      Sistema activo
    </div>
    <div class="eyebrow">BMM · Escalaciones</div>
    <div class="title">Nueva Alerta</div>
  </div>

  <div class="form-area">
    <form id="formAlerta">

      <div class="field">
        <label class="field-label" for="nombre">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Tu nombre (Reportado por) <span class="required">*</span>
        </label>
        <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
      </div>

      <div class="field">
        <label class="field-label" for="fit">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Línea de producción (FIT) <span class="required">*</span>
        </label>
        <div class="input-wrap">
          <select id="fit" required>
            <option value="">Cargando líneas...</option>
          </select>
          <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="mensaje">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Descripción del problema <span class="required">*</span>
        </label>
        <textarea id="mensaje" required placeholder="Describe brevemente la situación..."></textarea>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-informar" id="btnInformar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          Informar
        </button>
        <div class="action-hint">Notifica solo al Team Leader de la línea. Sin escalación.</div>

        <button type="button" class="btn btn-escalar" id="btnEscalar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          Escalar
        </button>
        <div class="action-hint">Inicia la cadena de escalación (Team Leader → Operations Mgr → PC Director).</div>
      </div>

      <div id="resultado" class="resultado"></div>
    </form>

    <div class="footer">
      <img src="icons/digital-logo.png" alt="Digital Manufacturing">
    </div>
  </div>
</div>

<script type="module">
  import { db, iniciarSesionAnonima, APPS_SCRIPT_URL } from "./firebase-config.js";
  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  iniciarSesionAnonima().catch(err => console.error("Error auth anónima:", err));

  const selectFit = document.getElementById("fit");
  const btnInformar = document.getElementById("btnInformar");
  const btnEscalar = document.getElementById("btnEscalar");
  const resultado = document.getElementById("resultado");
  const inputNombre = document.getElementById("nombre");
  const inputMensaje = document.getElementById("mensaje");

  // ---------- Cargar FITs disponibles ----------
  async function cargarFITs() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getFITs`);
      const data = await res.json();
      selectFit.innerHTML = '<option value="">Selecciona una línea...</option>';
      data.fits.forEach(fit => {
        const opt = document.createElement("option");
        opt.value = fit;
        opt.textContent = fit;
        selectFit.appendChild(opt);
      });
    } catch (err) {
      selectFit.innerHTML = '<option value="">Error al cargar líneas</option>';
      console.error(err);
    }
  }
  cargarFITs();

  // ---------- Validación compartida ----------
  function formularioValido() {
    return inputNombre.value.trim() && selectFit.value && inputMensaje.value.trim();
  }

  function marcarCamposInvalidos() {
    resultado.className = "resultado error";
    resultado.textContent = "⚠️ Completa todos los campos antes de continuar.";
  }

  // ---------- Crear alerta (compartido por Informar y Escalar) ----------
  async function crearAlerta(tipoAlerta, botonActivo, otroBoton) {
    if (!formularioValido()) {
      marcarCamposInvalidos();
      return;
    }

    botonActivo.disabled = true;
    otroBoton.disabled = true;
    const textoOriginal = botonActivo.innerHTML;
    botonActivo.innerHTML = "Enviando...";
    resultado.className = "resultado";

    const nombre = inputNombre.value.trim();
    const fit = selectFit.value;
    const mensaje = inputMensaje.value.trim();

    try {
      // 1. Buscar el Team Leader asignado a ese FIT (igual para ambos tipos)
      const resTL = await fetch(`${APPS_SCRIPT_URL}?action=getTeamLeader&fit=${encodeURIComponent(fit)}`);
      const dataTL = await resTL.json();

      if (!dataTL.encontrado) {
        throw new Error("No se encontró un Team Leader para esa línea.");
      }

      const teamLeader = dataTL.teamLeaders[0];
      const ahora = serverTimestamp();

      // 2. Crear la alerta en Firestore, con tipoAlerta según el botón usado
      const docRef = await addDoc(collection(db, "alertas"), {
        emisor: nombre,
        fit: fit,
        mensaje: mensaje,
        estado: "pendiente",
        tipoAlerta: tipoAlerta, // "informar" | "escalar"
        nivelActual: "TeamLeader",
        destinatarioActual: {
          nomina: teamLeader.nomina,
          nombre: teamLeader.nombre,
          rango: teamLeader.rango
        },
        horaCreacion: ahora,
        horaLlegadaNivelActual: ahora,
        visto: false,
        historial: [
          { nivel: "TeamLeader", accion: "creada", tipoAlerta: tipoAlerta, nombreDestinatario: teamLeader.nombre }
        ]
      });

      // 3. Disparar el push al Team Leader
      await fetch(`${APPS_SCRIPT_URL}?action=enviarPush&nomina=${teamLeader.nomina}&alertaId=${docRef.id}&mensaje=${encodeURIComponent(mensaje)}&fit=${encodeURIComponent(fit)}`);

      resultado.className = "resultado ok";
      const etiqueta = tipoAlerta === "informar" ? "Informada" : "Escalada";
      resultado.textContent = `✅ Alerta enviada a ${teamLeader.nombre} (Team Leader) · ${etiqueta}`;
      document.getElementById("formAlerta").reset();
      cargarFITs(); // recarga el placeholder del select tras el reset

    } catch (err) {
      resultado.className = "resultado error";
      resultado.textContent = "❌ " + err.message;
      console.error(err);
    } finally {
      botonActivo.disabled = false;
      otroBoton.disabled = false;
      botonActivo.innerHTML = textoOriginal;
    }
  }

  btnInformar.addEventListener("click", () => crearAlerta("informar", btnInformar, btnEscalar));
  btnEscalar.addEventListener("click", () => crearAlerta("escalar", btnEscalar, btnInformar));
</script>

</body>
</html>
